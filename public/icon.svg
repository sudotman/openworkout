  <rect x="170" y="197" width="36" height="118" rx="18" fill="#ff5a1f"/>
  <rect x="306" y="197" width="36" height="118" rx="18" fill="#ff5a1f"/>
  <rect x="188" y="242.5" width="136" height="27" rx="13.5" fill="#ff5a1f"/>
</svg>
