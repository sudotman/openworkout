<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Share overflow test</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #ded9cf; font-family: Manrope, sans-serif; }
      main { display: flex; align-items: center; gap: 48px; }
      p { width: 240px; color: #171713; font-size: 22px; line-height: 1.35; }
      img { width: 405px; height: 720px; object-fit: cover; box-shadow: 0 24px 60px rgba(0,0,0,.2); }
    </style>
  </head>
  <body>
    <main>
      <p>Six completed movements<br><strong>Expected overflow: +2</strong></p>
      <img alt="Six movement share export" />
    </main>
    <script type="module">
      import '@fontsource-variable/manrope'
      import '@fontsource/dm-mono/400.css'
      import '@fontsource/dm-mono/500.css'
      import { createWorkoutShareImage } from '/src/lib/share-card.js'

      const names = [
        'Barbell Bench Press',
        'Weighted Pull-Up',
        'Overhead Press',
        'Cable Row',
        'Incline Dumbbell Press',
        'Lateral Raise',
      ]
      const exerciseMap = new Map(names.map((name, index) => [
        `strength-${index}`,
        { id: `strength-${index}`, name, trackingType: 'strength' },
      ]))
      const workout = {
        name: 'Full body strength',
        startedAt: '2026-08-15T12:00:00.000Z',
        completedAt: '2026-08-15T13:02:00.000Z',
        durationSeconds: 3720,
        exercises: names.map((name, index) => ({
          exerciseId: `strength-${index}`,
          sets: Array.from({ length: index < 4 ? 3 : 2 }, (_, setIndex) => ({
            id: `${index}-${setIndex}`,
            completed: true,
            type: 'normal',
            weight: Math.max(8, 70 - index * 9),
            reps: 6 + setIndex,
          })),
        })),
      }
      const blob = await createWorkoutShareImage(workout, 'kg', 'km', exerciseMap)
      document.querySelector('img').src = URL.createObjectURL(blob)
    </script>
  </body>
</html>
