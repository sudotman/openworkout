<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWorkout · Share directions</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url('/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'DM Mono';
        src: url('/node_modules/@fontsource/dm-mono/files/dm-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'DM Mono';
        src: url('/node_modules/@fontsource/dm-mono/files/dm-mono-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        color: #11120f;
        background: #e9e7e0;
        font-family: Manrope, sans-serif;
      }
      .board {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        padding: 26px 42px 34px;
      }
      .board-head {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        margin: 0 auto 22px;
        width: min(100%, 1000px);
      }
      .board-index,
      .board-mode,
      .eyebrow,
      .meta,
      .micro,
      .row,
      .metric-label,
      .spec,
      .brand {
        font-family: 'DM Mono', monospace;
        text-transform: uppercase;
      }
      .board-index { font-size: 12px; letter-spacing: .08em; }
      .board-title { margin: 4px 0 0; font-size: 30px; line-height: 1; letter-spacing: -.045em; }
      .board-mode { color: #706e67; font-size: 10px; letter-spacing: .1em; }
      .pair {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 60px;
      }
      .preview { position: relative; }
      .preview::before {
        position: absolute;
        inset: 18px -16px -18px 16px;
        z-index: -1;
        background: rgba(22, 22, 18, .10);
        filter: blur(22px);
        content: '';
      }
      .story {
        position: relative;
        width: 337.5px;
        height: 600px;
        overflow: hidden;
        isolation: isolate;
      }
      .story strong { font-weight: 720; }
      .mode-tag {
        position: absolute;
        top: 14px;
        right: -10px;
        z-index: 4;
        padding: 6px 12px;
        color: #fff;
        background: #181914;
        font: 500 8px/1 'DM Mono', monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
        transform: rotate(3deg);
      }

      /* 01 — Quiet Ledger */
      .v1 {
        padding: 27px 27px 24px;
        color: #171713;
        background: #f3efe5;
      }
      .v1::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: .2;
        background-image: radial-gradient(#847e70 .45px, transparent .45px);
        background-size: 5px 5px;
        content: '';
      }
      .v1 .top {
        display: flex;
        justify-content: space-between;
        padding-bottom: 18px;
        border-bottom: 1px solid #1c1c17;
      }
      .v1 .brand { font: 700 10px/1 Manrope, sans-serif; letter-spacing: -.02em; }
      .v1 .meta { font-size: 7px; line-height: 1.4; text-align: right; }
      .v1 h2 {
        max-width: 250px;
        margin: 30px 0 16px;
        font-size: 42px;
        line-height: .9;
        letter-spacing: -.07em;
        text-transform: uppercase;
      }
      .v1 .metric-block {
        position: relative;
        margin: 0 -4px;
        padding: 18px 4px 15px;
        border-top: 1px solid #1c1c17;
        border-bottom: 1px solid #1c1c17;
      }
      .v1 .metric-label { font-size: 7px; letter-spacing: .08em; }
      .v1 .metric {
        display: flex;
        align-items: baseline;
        margin: 4px 0 -9px;
        gap: 7px;
        font-size: 94px;
        font-weight: 760;
        line-height: 1;
        letter-spacing: -.09em;
      }
      .v1 .metric small { color: #d7432f; font: 600 14px/1 'DM Mono', monospace; letter-spacing: 0; }
      .v1 .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid #1c1c17; }
      .v1 .fact { padding: 13px 5px 15px; }
      .v1 .fact + .fact { border-left: 1px solid #1c1c17; padding-left: 12px; }
      .v1 .fact span { display: block; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }
      .v1 .fact strong { display: block; margin-top: 7px; font-size: 13px; letter-spacing: -.04em; }
      .v1 .details { margin-top: 17px; }
      .v1 .row { display: grid; grid-template-columns: 22px 1fr auto; padding: 6px 0; border-bottom: 1px dotted #9e9889; font-size: 7px; }
      .v1 .footer { position: absolute; right: 27px; bottom: 22px; left: 27px; display: flex; justify-content: space-between; font: 500 6px/1 'DM Mono', monospace; text-transform: uppercase; }
      .v1 .seal { width: 7px; height: 7px; background: #d7432f; border-radius: 50%; }

      /* 02 — Type Block */
      .v2 {
        padding: 25px 25px 22px 68px;
        color: #f5f5ef;
        background: #11120f;
      }
      .v2::before {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 44px;
        background: #c7ff28;
        content: '';
      }
      .v2 .spine {
        position: absolute;
        bottom: 26px;
        left: 14px;
        color: #11120f;
        font: 800 13px/1 Manrope, sans-serif;
        letter-spacing: -.02em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }
      .v2 .top { display: flex; justify-content: space-between; align-items: center; }
      .v2 .brand { font: 750 9px/1 Manrope, sans-serif; }
      .v2 .meta { color: #9d9f97; font-size: 6px; }
      .v2 h2 {
        margin: 54px 0 0;
        font-size: 42px;
        line-height: .86;
        letter-spacing: -.07em;
        text-transform: uppercase;
      }
      .v2 .metric-label { margin-top: 45px; color: #c7ff28; font-size: 7px; }
      .v2 .metric {
        margin: 1px 0 0 -4px;
        font-size: 112px;
        font-weight: 780;
        line-height: .88;
        letter-spacing: -.11em;
        white-space: nowrap;
      }
      .v2 .metric small { margin-left: 7px; color: #c7ff28; font: 500 13px/1 'DM Mono', monospace; letter-spacing: 0; }
      .v2 .facts { display: flex; margin-top: 22px; gap: 20px; }
      .v2 .fact { min-width: 58px; }
      .v2 .fact span { display: block; color: #85877f; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }
      .v2 .fact strong { display: block; margin-top: 7px; font: 650 13px/1 Manrope, sans-serif; }
      .v2 .rule { height: 1px; margin: 25px 0 14px; background: #3a3c35; }
      .v2 .row { display: flex; justify-content: space-between; padding: 5px 0; color: #b5b7ae; font-size: 6px; }
      .v2 .row b { color: #fff; font-weight: 500; }
      .v2 .footer { position: absolute; right: 25px; bottom: 22px; color: #777a71; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }

      /* 03 — Track Plot */
      .v3 {
        padding: 25px 25px 22px;
        color: #f5f2e9;
        background: #2447e8;
      }
      .v3::before {
        position: absolute;
        inset: 0;
        z-index: -2;
        opacity: .24;
        background-image: linear-gradient(rgba(255,255,255,.28) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.28) 1px, transparent 1px);
        background-size: 42px 42px;
        content: '';
      }
      .v3 .top { display: flex; justify-content: space-between; align-items: center; }
      .v3 .brand { font: 750 9px/1 Manrope, sans-serif; }
      .v3 .meta { font-size: 6px; }
      .v3 h2 {
        max-width: 240px;
        margin: 32px 0 0;
        font-size: 37px;
        line-height: .9;
        letter-spacing: -.06em;
        text-transform: uppercase;
      }
      .v3 .plot {
        position: relative;
        height: 225px;
        margin: 30px -25px 0;
        border-top: 1px solid rgba(255,255,255,.55);
        border-bottom: 1px solid rgba(255,255,255,.55);
      }
      .v3 .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .v3 .plot path { fill: none; stroke: #eefba2; stroke-width: 3; vector-effect: non-scaling-stroke; }
      .v3 .plot circle { fill: #eefba2; }
      .v3 .plot .axis { stroke: rgba(255,255,255,.28); stroke-width: 1; }
      .v3 .metric-wrap { position: absolute; top: 45px; left: 25px; }
      .v3 .metric-label { font-size: 7px; }
      .v3 .metric { font-size: 82px; font-weight: 760; line-height: .95; letter-spacing: -.09em; }
      .v3 .metric small { margin-left: 5px; color: #eefba2; font: 500 13px/1 'DM Mono', monospace; letter-spacing: 0; }
      .v3 .facts { display: grid; grid-template-columns: repeat(3, 1fr); padding-top: 20px; }
      .v3 .fact span { display: block; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }
      .v3 .fact strong { display: block; margin-top: 7px; font-size: 13px; }
      .v3 .details { margin-top: 22px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.5); }
      .v3 .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 6px; }
      .v3 .footer { position: absolute; right: 25px; bottom: 22px; left: 25px; display: flex; justify-content: space-between; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }

      /* 04 — Issue 08 */
      .v4 {
        color: #0d0e0c;
        background: #f5f5f0;
      }
      .v4 .mast {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 48px;
        padding: 0 20px;
        color: white;
        background: #10110e;
      }
      .v4 .brand { font: 800 10px/1 Manrope, sans-serif; }
      .v4 .meta { font-size: 6px; }
      .v4 .issue {
        padding: 18px 20px 13px;
        border-bottom: 1px solid #10110e;
        font: 500 7px/1 'DM Mono', monospace;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .v4 h2 {
        margin: 0;
        padding: 18px 20px 15px;
        font-size: 46px;
        line-height: .84;
        letter-spacing: -.075em;
        text-transform: uppercase;
      }
      .v4 .band {
        display: grid;
        grid-template-columns: 1fr 70px;
        min-height: 150px;
        color: #0e0f0d;
        background: #ff5b35;
        border-top: 1px solid #10110e;
        border-bottom: 1px solid #10110e;
      }
      .v4 .metric-block { padding: 18px 18px 13px 20px; }
      .v4 .metric-label { font-size: 7px; }
      .v4 .metric { margin-left: -3px; font-size: 76px; font-weight: 800; line-height: 1; letter-spacing: -.095em; white-space: nowrap; }
      .v4 .metric small { margin-left: 5px; font: 500 12px/1 'DM Mono', monospace; letter-spacing: 0; }
      .v4 .session-no {
        display: grid;
        place-items: center;
        border-left: 1px solid #10110e;
        font: 700 31px/1 Manrope, sans-serif;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }
      .v4 .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid #10110e; }
      .v4 .fact { min-height: 67px; padding: 13px 10px 10px 20px; }
      .v4 .fact + .fact { border-left: 1px solid #10110e; }
      .v4 .fact span { display: block; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }
      .v4 .fact strong { display: block; margin-top: 6px; font-size: 12px; }
      .v4 .details { padding: 15px 20px; }
      .v4 .row { display: grid; grid-template-columns: 24px 1fr auto; padding: 5px 0; border-bottom: 1px solid #c7c7bf; font-size: 6px; }
      .v4 .footer { position: absolute; right: 20px; bottom: 16px; left: 20px; display: flex; justify-content: space-between; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }

      /* 05 — Night Index */
      .v5 {
        padding: 26px 27px 23px;
        color: #e8ede7;
        background: #101b21;
      }
      .v5::before {
        position: absolute;
        inset: 0;
        z-index: -2;
        opacity: .23;
        background: repeating-linear-gradient(104deg, transparent 0 29px, #849198 30px 31px, transparent 32px 59px);
        content: '';
      }
      .v5::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: rgba(16, 27, 33, .88);
        content: '';
      }
      .v5 .top { display: flex; justify-content: space-between; align-items: center; }
      .v5 .brand { font: 750 9px/1 Manrope, sans-serif; letter-spacing: .02em; }
      .v5 .meta { color: #9aa8ad; font-size: 6px; }
      .v5 .index { margin-top: 49px; color: #c8a675; font: 500 7px/1 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
      .v5 h2 {
        max-width: 260px;
        margin: 11px 0 0;
        font-size: 44px;
        line-height: .88;
        letter-spacing: -.065em;
        text-transform: uppercase;
      }
      .v5 .metric-block { margin-top: 43px; padding: 18px 0 15px; border-top: 1px solid #607078; border-bottom: 1px solid #607078; }
      .v5 .metric-label { color: #91a0a5; font-size: 7px; }
      .v5 .metric { margin-left: -4px; font-size: 91px; font-weight: 700; line-height: 1; letter-spacing: -.095em; white-space: nowrap; }
      .v5 .metric small { margin-left: 7px; color: #c8a675; font: 500 13px/1 'DM Mono', monospace; letter-spacing: 0; }
      .v5 .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; padding-top: 17px; }
      .v5 .fact span { display: block; color: #829198; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }
      .v5 .fact strong { display: block; margin-top: 7px; font-size: 13px; }
      .v5 .details { margin-top: 29px; }
      .v5 .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #34434a; color: #b8c1c1; font-size: 6px; }
      .v5 .row b { color: #e8ede7; font-weight: 500; }
      .v5 .footer { position: absolute; right: 27px; bottom: 22px; left: 27px; display: flex; align-items: center; justify-content: space-between; color: #86959a; font: 400 6px/1 'DM Mono', monospace; text-transform: uppercase; }
      .v5 .footer i { width: 38px; height: 1px; background: #c8a675; }

      @media (max-width: 820px) {
        .board { padding: 22px 18px 28px; }
        .pair { gap: 18px; transform: scale(.78); transform-origin: top center; }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      const variants = [
        { name: 'Quiet Ledger', note: 'Warm editorial · precise, calm, tactile' },
        { name: 'Type Block', note: 'Oversized typography · blunt, graphic, modern' },
        { name: 'Track Plot', note: 'Performance chart · energetic, data-forward' },
        { name: 'Issue 08', note: 'Sports magazine · bold, compact, collectible' },
        { name: 'Night Index', note: 'Dark technical · restrained, premium, atmospheric' },
      ]
      const data = {
        strength: {
          title: 'Upper strength', label: 'Total volume', metric: '5,240', unit: 'kg',
          facts: [['Duration', '47 min'], ['Work sets', '12'], ['Movements', '4']],
          rows: [['01', 'Barbell bench press', '4 × 6'], ['02', 'Weighted pull-up', '4 × 8'], ['03', 'Overhead press', '3 × 8']],
          plot: 'M0 165 C42 155 62 122 100 129 S164 88 199 99 S260 42 338 55',
        },
        cardio: {
          title: 'Treadmill run', label: 'Distance', metric: '5.00', unit: 'km',
          facts: [['Run time', '27:30'], ['Avg pace', '5:30 /km'], ['Avg speed', '10.9']],
          rows: [['01', 'KM 01', '5:38'], ['02', 'KM 02', '5:31'], ['03', 'KM 03–05', '5:27 avg']],
          plot: 'M0 151 C38 137 65 145 98 121 S159 129 198 96 S257 87 338 46',
        },
      }

      const facts = (items) => `<div class="facts">${items.map(([l,v]) => `<div class="fact"><span>${l}</span><strong>${v}</strong></div>`).join('')}</div>`
      const rows = (items) => `<div class="details">${items.map(([n,l,v]) => `<div class="row"><span>${n}</span><b>${l}</b><span>${v}</span></div>`).join('')}</div>`
      const plot = (d) => `<svg viewBox="0 0 338 225" preserveAspectRatio="none" aria-hidden="true"><line class="axis" x1="0" y1="56" x2="338" y2="56"/><line class="axis" x1="0" y1="112" x2="338" y2="112"/><line class="axis" x1="0" y1="168" x2="338" y2="168"/><path d="${d.plot}"/><circle cx="99" cy="121" r="4"/><circle cx="198" cy="96" r="4"/><circle cx="334" cy="48" r="4"/></svg>`

      function card(variant, mode) {
        const d = data[mode]
        const commonTop = `<div class="top"><span class="brand">OPENWORKOUT</span><span class="meta">08 AUG 2026<br/>07:14 PM</span></div>`
        const metric = `<div class="metric-block"><div class="metric-label">${d.label}</div><div class="metric">${d.metric}<small>${d.unit}</small></div></div>`
        if (variant === 1) return `<article class="story v1">${commonTop}<h2>${d.title}</h2>${metric}${facts(d.facts)}${rows(d.rows)}<div class="footer"><span class="seal"></span><span>Session 218 · Local record</span></div></article>`
        if (variant === 2) return `<article class="story v2"><span class="spine">${d.title}</span>${commonTop}<h2>${d.title}</h2><div class="metric-label">${d.label}</div><div class="metric">${d.metric}<small>${d.unit}</small></div>${facts(d.facts)}<div class="rule"></div>${rows(d.rows)}<div class="footer">Session / 218 / Complete</div></article>`
        if (variant === 3) return `<article class="story v3">${commonTop}<h2>${d.title}</h2><div class="plot">${plot(d)}<div class="metric-wrap"><div class="metric-label">${d.label}</div><div class="metric">${d.metric}<small>${d.unit}</small></div></div></div>${facts(d.facts)}${rows(d.rows)}<div class="footer"><span>OW / Training log</span><span>Session 218</span></div></article>`
        if (variant === 4) return `<article class="story v4"><div class="mast"><span class="brand">OPENWORKOUT</span><span class="meta">TRAINING LOG / 08</span></div><div class="issue">Session report · Saturday 08 August</div><h2>${d.title}</h2><div class="band"><div class="metric-block"><div class="metric-label">${d.label}</div><div class="metric">${d.metric}<small>${d.unit}</small></div></div><div class="session-no">218</div></div>${facts(d.facts)}${rows(d.rows)}<div class="footer"><span>Recorded locally</span><span>Openworkout / 2026</span></div></article>`
        return `<article class="story v5">${commonTop}<div class="index">Training index / 218</div><h2>${d.title}</h2>${metric}${facts(d.facts)}${rows(d.rows)}<div class="footer"><span>08.08.26</span><i></i><span>OpenWorkout</span></div></article>`
      }

      const chosen = Math.min(5, Math.max(1, Number(new URLSearchParams(location.search).get('variant')) || 1))
      const v = variants[chosen - 1]
      document.querySelector('#app').innerHTML = `
        <section class="board">
          <header class="board-head">
            <div><div class="board-index">Direction ${String(chosen).padStart(2, '0')}</div><h1 class="board-title">${v.name}</h1></div>
            <div class="board-mode">${v.note}</div>
          </header>
          <div class="pair">
            <div class="preview"><span class="mode-tag">Strength</span>${card(chosen, 'strength')}</div>
            <div class="preview"><span class="mode-tag">Cardio</span>${card(chosen, 'cardio')}</div>
          </div>
        </section>`
    </script>
  </body>
</html>
