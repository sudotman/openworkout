<!doctype html>
<html lang="en" data-preview-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWorkout theme preview</title>
    <style>
      html[data-preview-theme='graphite'] {
        --ink: #171914; --ink-soft: #2b2e27; --muted: #72766d; --muted-2: #a1a49c;
        --surface: #f3f2eb; --surface-raised: #fbfaf5; --surface-alt: #e9e8df; --line: #d9d9d0;
        --accent: #d9ff4f; --accent-dark: #b5dd29; --theme-sidebar: #11130f; --theme-sidebar-text: #fff;
        --theme-active-soft: rgba(217,255,79,.085); --theme-accent-ink: #151712;
        --theme-button-dark: #171914; --theme-button-dark-ink: #fff;
      }
      html[data-preview-theme='terracotta'] {
        --ink: #241b17; --ink-soft: #3b2e28; --muted: #79695e; --muted-2: #aa998b;
        --surface: #f1e8dc; --surface-raised: #fbf3e9; --surface-alt: #e7d9cb; --line: #d9c8b9;
        --accent: #d4543c; --accent-dark: #b73e2a; --theme-sidebar: #2a1d17; --theme-sidebar-text: #fff8f0;
        --theme-active-soft: rgba(212,84,60,.16); --theme-accent-ink: #fff8f0;
        --theme-button-dark: #2a1d17; --theme-button-dark-ink: #fff8f0;
      }
      html[data-preview-theme='cobalt'] {
        --ink: #121a2e; --ink-soft: #28344e; --muted: #68738b; --muted-2: #9aa5b9;
        --surface: #f0f2f7; --surface-raised: #fbfcff; --surface-alt: #e4e8f1; --line: #d2d9e6;
        --accent: #3156d9; --accent-dark: #2343b8; --theme-sidebar: #111a32; --theme-sidebar-text: #f6f8ff;
        --theme-active-soft: rgba(82,117,232,.17); --theme-accent-ink: #fff;
        --theme-button-dark: #17233f; --theme-button-dark-ink: #fff;
      }
      html[data-preview-theme='field'] {
        --ink: #172018; --ink-soft: #2c3b30; --muted: #657065; --muted-2: #98a195;
        --surface: #eceee6; --surface-raised: #f7f8f2; --surface-alt: #dde2d5; --line: #ccd3c8;
        --accent: #9ac866; --accent-dark: #76a846; --theme-sidebar: #13231b; --theme-sidebar-text: #f2f8ef;
        --theme-active-soft: rgba(154,200,102,.15); --theme-accent-ink: #142014;
        --theme-button-dark: #183024; --theme-button-dark-ink: #f2f8ef;
      }
      html[data-preview-theme='oxblood'] {
        --ink: #271719; --ink-soft: #432b2f; --muted: #7c686b; --muted-2: #aa9698;
        --surface: #f2ece8; --surface-raised: #fffaf7; --surface-alt: #e7dbd6; --line: #dbcacc;
        --accent: #972d40; --accent-dark: #771d2e; --theme-sidebar: #241416; --theme-sidebar-text: #fff5f3;
        --theme-active-soft: rgba(151,45,64,.18); --theme-accent-ink: #fff7f5;
        --theme-button-dark: #321a1f; --theme-button-dark-ink: #fff7f5;
      }
      html[data-preview-theme='midnight'] {
        color-scheme: dark;
        --ink: #edf4f6; --ink-soft: #cfdae0; --muted: #91a3ad; --muted-2: #667a86;
        --surface: #101820; --surface-raised: #17232c; --surface-alt: #1c2933; --line: #2e3d47;
        --accent: #73d8ff; --accent-dark: #42bce9; --theme-sidebar: #080f15; --theme-sidebar-text: #eef8fc;
        --theme-active-soft: rgba(115,216,255,.13); --theme-accent-ink: #08141a;
        --theme-button-dark: #edf4f6; --theme-button-dark-ink: #101820;
      }

      html[data-preview-theme] { color: var(--ink) !important; background: var(--theme-sidebar) !important; }
      html[data-preview-theme] body,
      html[data-preview-theme] .app-shell { color: var(--ink); background: var(--surface) !important; }
      html[data-preview-theme] .sidebar,
      html[data-preview-theme] .mobile-topbar,
      html[data-preview-theme] .mobile-nav { color: var(--theme-sidebar-text) !important; background: var(--theme-sidebar) !important; }
      html[data-preview-theme] .brand-mark { border-color: color-mix(in srgb, var(--theme-sidebar-text) 42%, transparent); }
      html[data-preview-theme] .side-nav-item { color: color-mix(in srgb, var(--theme-sidebar-text) 52%, transparent); }
      html[data-preview-theme] .side-nav-item:hover { color: color-mix(in srgb, var(--theme-sidebar-text) 86%, transparent); background: color-mix(in srgb, var(--theme-sidebar-text) 5%, transparent); }
      html[data-preview-theme] .side-nav-item.is-active { color: var(--accent); background: var(--theme-active-soft); }
      html[data-preview-theme] .privacy-note { color: color-mix(in srgb, var(--theme-sidebar-text) 62%, transparent); background: color-mix(in srgb, var(--theme-sidebar-text) 5%, transparent); border-color: color-mix(in srgb, var(--theme-sidebar-text) 8%, transparent); }
      html[data-preview-theme] .privacy-note strong { color: color-mix(in srgb, var(--theme-sidebar-text) 84%, transparent); }
      html[data-preview-theme] .sidebar-signature { color: color-mix(in srgb, var(--theme-sidebar-text) 28%, transparent); }
      html[data-preview-theme] .button--accent { color: var(--theme-accent-ink); background: var(--accent); }
      html[data-preview-theme] .button--accent:hover { background: var(--accent-dark); }
      html[data-preview-theme] .button--dark { color: var(--theme-button-dark-ink); background: var(--theme-button-dark); }
      html[data-preview-theme] .button--outline { border-color: var(--line); }
      html[data-preview-theme] .template-row:hover,
      html[data-preview-theme] .history-row:hover { background: var(--surface-raised); }
      html[data-preview-theme] .week-bars i { background: var(--line); }
      html[data-preview-theme] .date-tile { color: var(--theme-sidebar-text); background: var(--theme-sidebar); }
      html[data-preview-theme] .sheet,
      html[data-preview-theme] .dialog-panel { color: var(--ink); background: var(--surface-raised); }
      html[data-preview-theme] .session-hero-shade {
        background: linear-gradient(90deg,
          color-mix(in srgb, var(--theme-sidebar) 90%, transparent) 0%,
          color-mix(in srgb, var(--theme-sidebar) 68%, transparent) 44%,
          color-mix(in srgb, var(--theme-sidebar) 12%, transparent) 79%),
          linear-gradient(0deg, color-mix(in srgb, var(--theme-sidebar) 52%, transparent) 0%, transparent 45%);
      }
      body::before {
        position: fixed; z-index: 9999; top: 14px; left: 266px; padding: 7px 10px;
        color: var(--ink); background: var(--surface-raised); border: 1px solid var(--line);
        border-radius: 999px; box-shadow: 0 5px 18px rgba(0,0,0,.08);
        content: attr(data-theme-label); font: 500 9px/1 'DM Mono', monospace; letter-spacing: .08em;
      }
    </style>
    <script>
      const themes = [
        ['graphite', '01 / GRAPHITE ACID'],
        ['terracotta', '02 / TERRACOTTA PAPER'],
        ['cobalt', '03 / INTERNATIONAL BLUE'],
        ['field', '04 / FIELD NOTES'],
        ['oxblood', '05 / OXBLOOD STUDIO'],
        ['midnight', '06 / MIDNIGHT ICE'],
      ]
      const index = Math.min(5, Math.max(0, Number(new URLSearchParams(location.search).get('theme') || 1) - 1))
      document.documentElement.dataset.previewTheme = themes[index][0]
      window.addEventListener('DOMContentLoaded', () => { document.body.dataset.themeLabel = themes[index][1] })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
